[project]
name = "primitive-db"
version = "0.1.0"
description = "Учебная консольная база данных на Python"
readme = "README.md"
authors = [
    { name = "Александр Нечаев" },
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.10.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
